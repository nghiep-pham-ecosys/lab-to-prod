# Content calendar. Source of truth for what is posted on which day.
# Weeks with stage "trial" belong to the 4-week trial (16 Nov to 13 Dec 2026).
# Weeks with stage "backlog" are proposals: edit or delete freely before they are drafted.
# From 2026-W48 on, every item carries work: <id> from content/work.yaml (merged work only).
# tools/validate.py checks the calendar, the ledger and every post folder against this file.
timezone: Asia/Ho_Chi_Minh
post_time: "08:30"
short_time: "19:00"

# Target share of items per pillar. validate.py warns when the calendar drifts
# more than 10 points from a target.
pillars:
  ai-engineering: {name: "AI Engineering in production", target: 0.35}
  simulation-physical-ai: {name: "Simulation and Physical AI", target: 0.15}
  climate-materials: {name: "Climate x AI, chemistry and materials", target: 0.15}
  ml-foundations: {name: "ML Foundations", target: 0.20}
  learning-in-public: {name: "Learning in public: DSA in Java, Cloud and DevOps", target: 0.15}

series:
  dsa-in-java: {name: "DSA in Java", pillar: learning-in-public, kind: post}
  cloud-devops: {name: "Cloud & DevOps", pillar: learning-in-public, kind: post}
  ml-foundations: {name: "ML Foundations", pillar: ml-foundations, kind: post}
  ai-engineering: {name: "AI Engineering", pillar: ai-engineering, kind: post}
  climate-ai: {name: "Climate x AI", pillar: climate-materials, kind: post, sources_required: true}
  simulation: {name: "Simulation", pillar: simulation-physical-ai, kind: post, sources_required: true}
  physical-ai: {name: "Physical AI", pillar: simulation-physical-ai, kind: post, sources_required: true}
  build-log: {name: "Build log", pillar: ai-engineering, kind: blog}
  deep-dive: {name: "Deep dive", pillar: ai-engineering, kind: blog}

weeks:
  - week: 2026-W47
