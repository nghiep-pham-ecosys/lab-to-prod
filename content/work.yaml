# Work ledger: project work that is merged and may become a post.
#
# From 2026-W48 on, every calendar item and every post carries `work:`, one id or a list of ids
# from this file (tools/validate.py checks it). A post is about the work it points to and nothing
# else. No merged work, no post: an empty week is better than a post about work that was not done.
#
# Each entry:
#   id      lowercase words joined by hyphens, never changed once a post uses it
#   repo    a repo listed under `repos` below
#   ref     public repo: the merged pull request URL
#           private repo: private@<commit sha on main>; the repo is named, never linked
#   merged  merge date in Asia/Ho_Chi_Minh; a post may not be dated before it
#   what    one or two sentences on what the work does, in public-safe words
#
# Only the repos below may be a post source. A repo that is not listed is never a post source
# and is never named in this repository.
repos:
  public: [lab-to-prod, process-sim-lab, nghiep-motion-studio, ecosys]
  private: [claude-for-everyone-vi, physic-ai-for-everyone]

entries:
  - id: psl-cstr-skeleton
    repo: process-sim-lab
    ref: https://github.com/nghiep-pham-ecosys/process-sim-lab/pull/2
    merged: 2026-11-13
    what: >-
      Week 1 skeleton: a Stream type and an isothermal CSTR for a first-order reaction A to B,
      tested against the analytic conversion X = k tau / (1 + k tau) and a mole balance (8 tests).
  - id: psl-pfr-mixer-splitter
    repo: process-sim-lab
    ref: https://github.com/nghiep-pham-ecosys/process-sim-lab/pull/6
    merged: 2026-11-17
    what: >-
      An isothermal first-order PFR (X = 1 - exp(-k tau)), a mixer and a splitter, with 17 tests
      on hand-derived values; 2000 CSTRs in series come within 2e-4 of the PFR.
  - id: psl-flash-rachford-rice
    repo: process-sim-lab
    ref: https://github.com/nghiep-pham-ecosys/process-sim-lab/pull/7
    merged: 2026-11-17
    what: >-
      An isothermal flash drum with given K-values: bubble and dew checks first, then bisection of
      the Rachford-Rice equation on [0, 1], tested on cases with a known exact answer.
  - id: psl-antoine-lmtd
    repo: process-sim-lab
    ref: https://github.com/nghiep-pham-ecosys/process-sim-lab/pull/8
    merged: 2026-11-17
    what: >-
      Antoine vapour pressure for 3 components with NIST WebBook constants and valid ranges, and a
      counter-current heat exchanger sized from the LMTD (A = Q / (U LMTD)).
  - id: l2p-format-checks
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/27
    merged: 2026-11-16
    what: >-
      A rule-based check of each post against channel norms (word counts, hook length, paragraph
      size, an open question, X length), recorded in judge.json next to the LLM judge scores.
  - id: l2p-backup-cron
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/29
    merged: 2026-11-16
    what: >-
      A backup cron for the publish and blog workflows after GitHub skipped both morning runs;
      safe because the publisher skips posts already recorded in published.json.
  - id: l2p-open-question
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/31
    merged: 2026-11-16
    what: >-
      Every LinkedIn post ends with one open question about the reader's own experience, required
      by the write-post skill and checked by the format check.
  - id: l2p-wait-for-slot
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/33
    merged: 2026-11-17
    what: >-
      Scheduled runs start hours late in this repo (4.5-8.5 h measured on 12-17 Nov), so early
      crons start a job that sleeps until the target time, skips when another run already waits,
      and gives up when the wait would pass the 6 h job limit.
  - id: cfe-rag-bm25
    repo: claude-for-everyone-vi
    ref: private@e40a896
    merged: 2026-11-16
    what: >-
      A course module on retrieval-augmented generation: BM25 retrieval that runs locally, chunking
      and result-fusion exercises, search results passed to the model with citations, and a quiz.
  - id: cfe-ci-guard
    repo: claude-for-everyone-vi
    ref: private@fb18777
    merged: 2026-11-17
    what: >-
      A pre-push hook plus ci-result and pr-title checks, so a private repo on the free plan gets
      the same merge guard as the public ones.
  - id: pai-tf2-frames
    repo: physic-ai-for-everyone
    ref: private@481515f
    merged: 2026-11-16
    what: >-
      A ROS 2 lesson on coordinate frames and tf2: a frame broadcaster, a 2D rigid transform helper
      with tests, exercises and an English and Vietnamese lesson page.
  - id: psl-recycle-flowsheet
    repo: process-sim-lab
    ref: https://github.com/nghiep-pham-ecosys/process-sim-lab/pull/11
    merged: 2026-11-17
    what: >-
      A sequential-modular flowsheet read from JSON: the solver tears the recycle stream and
      converges it by direct substitution or Wegstein to 1e-10. On a mixer, CSTR and flash loop
      with a purge, every unit balance and the overall balance close within 1e-6.
  - id: cfe-cost-basics
    repo: claude-for-everyone-vi
    ref: private@b471008
    merged: 2026-11-17
    what: >-
      A course module on LLM API cost in mock mode: what the usage fields bill, an output cost
      ceiling from max_tokens before the call and a per-part breakdown after it, with 18 tests
      and no real API call.
  - id: pai-ci-guard
    repo: physic-ai-for-everyone
    ref: private@9fd7b93
    merged: 2026-11-17
    what: >-
      The same merge guard as cfe-ci-guard for a second private repo: a pre-push gitleaks hook,
      a ci-result gate and a pr-title check, with the contributing docs brought in line with the
      branch and title format the check now enforces.
  - id: l2p-work-ledger
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/41
    merged: 2026-11-17
    what: >-
      This work ledger, and validate.py checks that fail a post from 2026-W48 with no merged work
      behind it, work merged after the post date, an unlisted source repo or a linked private repo.
  - id: l2p-drafting-reads-ledger
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/42
    merged: 2026-11-17
    what: >-
      The weekly drafting command and the write-post skill take ideas only from the work ledger,
      read the merged change before writing, and stop when an item has no work ref.
  - id: l2p-work-link-checks
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/43
    merged: 2026-11-17
    what: >-
      Fact-check cuts any claim about built work that the diff, a test or the PR text does not
      show, the judging subagent scores how well a post matches its work, and Saturday articles
      need a work ref too.
  - id: l2p-replan-from-work
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/44
    merged: 2026-11-17
    what: >-
      The 2026-W48 and W49 calendar rebuilt from merged work only: 5 posts and a build log in
      W48, 3 posts and a deep dive in W49, and empty days where no work was merged.
  - id: ecosys-adr-template-first
    repo: ecosys
    ref: https://github.com/nghiep-pham-ecosys/ecosys/pull/45
    merged: 2026-11-17
    what: >-
      ADR 0005: every new project repo is generated from a template repo first (licences, CI with
      gitleaks, ci-result and pr-title, a pre-push hook for private repos), and lab projects get
      statuses and a WIP limit that grows step by step.
  - id: ecosys-adr-roles
    repo: ecosys
    ref: https://github.com/nghiep-pham-ecosys/ecosys/pull/46
    merged: 2026-11-17
    what: >-
      ADR 0006: Claude Code plans and drives each working session, a chat assistant only reports,
      approval is only the author's own message, at most two cloud routines run, and a routine may
      push to a private repo only behind a gitleaks check.
  - id: ecosys-cv-from-facts
    repo: ecosys
    ref: https://github.com/nghiep-pham-ecosys/ecosys/pull/53
    merged: 2026-11-18
    what: >-
      A CV builder that checks profile facts before it builds: unique ids, variants that point
      only at live facts, and every number inside a fact with an id. It then compiles a
      one-column, ATS-safe PDF with typst and prints ids and paths only, never profile text.
  - id: l2p-linkedin-document
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/48
    merged: 2026-11-18
    what: >-
      A post folder with a linkedin.pdf becomes a LinkedIn document post: upload the file, then
      a post that carries it; a PDF over 100 MB fails before any call. Tested with a fake HTTP
      client only, not yet verified live.
  - id: l2p-paper-notes
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/50
    merged: 2026-11-18
    what: >-
      Paper reading notes get a folder and a template; a merged note becomes a work entry and
      only then a post source, so posts about papers follow the same no-work-no-post rule.
  - id: psl-source-convention-test
    repo: process-sim-lab
    ref: https://github.com/nghiep-pham-ecosys/process-sim-lab/pull/18
    merged: 2026-11-18
    what: >-
      A convention test that fails when a model module has no Source line in its docstring or no
      matching test file; checked by misspelling one Source line and watching the test fail.
  - id: l2p-draft-week-routine
    repo: lab-to-prod
    ref: https://github.com/nghiep-pham-ecosys/lab-to-prod/pull/51
    merged: 2026-11-18
    what: >-
      Instructions for a Saturday cloud routine that drafts the week: stop checks first (a pause
      file, wrong day, an open week PR, missing ledger entries), ideas only from this ledger, one
      pull request, and never a merge or a post.
  - id: psl-tool-schemas
    repo: process-sim-lab
    ref: https://github.com/nghiep-pham-ecosys/process-sim-lab/pull/20
    merged: 2026-11-18
    what: >-
      One JSON Schema per operation (9 tools, an SI unit on every property, an example input
      taken from the hand-checked tests) and a small stdlib validator whose errors name the
      field path, such as "$.volume: must be > 0".
  - id: psl-tool-runner-evals
    repo: process-sim-lab
    ref: https://github.com/nghiep-pham-ecosys/process-sim-lab/pull/22
    merged: 2026-11-18
    what: >-
      A tool runner that validates a call, runs the operation and returns plain JSON or a typed
      error (unknown tool, invalid input, model error, convergence error), plus 10 fixed
      evaluation cases, each tied to its source test and tolerance: 10/10 pass, with no LLM call.
  - id: cfe-multistep-mock
    repo: claude-for-everyone-vi
    ref: private@10cb8a6
    merged: 2026-11-18
    what: >-
      The course's offline mock of the model API gains a multi-step mode that calls one pending
      tool per turn, so an agent loop runs without the API, and a lock so threads can share one
      mock, tested with 8 worker threads.
  - id: cfe-agents-workflows
    repo: claude-for-everyone-vi
    ref: private@1608d6a
    merged: 2026-11-18
    what: >-
      A course module on agents and workflows in mock mode: prompt chaining with a gate, routing,
      parallel runs, orchestrator-workers and evaluator-optimizer, then an agent loop with three
      stop conditions (stop_reason, a turn limit, a cost cap), an approval step for tools with
      side effects and a JSON trace, graded by 31 tests.
  - id: cfe-course-cost-estimate
    repo: claude-for-everyone-vi
    ref: private@1135966
    merged: 2026-11-18
    what: >-
      A worst-case cost for running every course script against the real API, summed module by
      module: about $0.072 with Haiku 5.5 and MAX_TOKENS=1024. It is an estimate from list prices,
      not a measured bill.
