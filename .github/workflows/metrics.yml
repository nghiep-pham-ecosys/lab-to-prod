name: metrics

# Every day at 22:00 Asia/Ho_Chi_Minh: collect numbers into metrics/metrics.csv and check
# that no token is about to expire. A token warning makes the run red, and GitHub emails it.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_TOKEN_ISSUED: ${{ vars.LINKEDIN_TOKEN_ISSUED }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      HAS_SECRETS: ${{ secrets.TELEGRAM_BOT_TOKEN != '' || secrets.FB_PAGE_TOKEN != '' || secrets.YT_REFRESH_TOKEN != '' || secrets.DEVTO_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Collect
        id: collect
        if: env.HAS_SECRETS == 'true'
        run: python -m metrics.collect | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -o pipefail {0}
      - name: Commit metrics
        if: always() && env.HAS_SECRETS == 'true'
        run: |
          if [ -n "$(git status --porcelain metrics/metrics.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add metrics/metrics.csv
            git commit -m "chore: daily metrics"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi
      - name: Token health
        if: always()
        run: python -m metrics.collect --tokens | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -o pipefail {0}
