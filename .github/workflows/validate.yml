name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Validate calendar, posts, banned terms and secrets
        run: python tools/validate.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Run the Java samples quoted in posts
        run: tools/run_samples.sh
