# One line per channel. "api" posts through the platform's free official API,
# "manual" only writes a file for the author to post by hand, "off" does nothing.
# If a platform starts charging for its API, switch it to manual here.
channels:
  linkedin: api
  facebook: api
  youtube: api
  telegram: off      # no audience yet (Nghiep, 13 Nov 2026); switch back to api when a channel exists
  devto: api
  hashnode: manual   # API needs a paid Pro plan since 13 May 2026 (hashnode.com/announcements/graphql-api)
  x: manual          # API is pay-per-use

site_url: "https://nghiep-pham-ecosys.github.io/lab-to-prod"
timezone_offset: "+07:00"
post_time: "08:30"

# Which trigger publishes which channel.
#   merge: runs when the weekly pull request lands on main; these platforms schedule by themselves
#   daily: runs every weekday morning; these platforms have no scheduling for this kind of token
events:
  merge: [facebook, youtube]
  daily: [linkedin, telegram, devto]

facebook_graph_version: "v27.0"
youtube_category_id: "28"   # Science & Technology
